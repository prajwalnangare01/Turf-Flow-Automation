# =============================================================================
# Render Blueprint Specification for TurfFlow Automation SKU
# Hosts: Admin Dashboard + Static Preview + WhatsApp AI Agent + Webhooks
# Repository: https://github.com/prajwalnangare01/Turf-Flow-Automation.git
# =============================================================================

services:
  - type: web
    name: turfflow-automation
    env: node
    plan: free # 100% Free Tier ($0/mo) - Uses Supabase for WhatsApp session persistence
    region: singapore # Close to India (low latency for Razorpay & WhatsApp)
    autoDeploy: true
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build && cd whatsapp-automation/server && npm install
    startCommand: node whatsapp-automation/server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WHATSAPP_SESSION_PATH
        value: /tmp/whatsapp_session
      - key: BASE_URL
        value: https://turfflow-automation.onrender.com
      - key: CLIENT_URL
        value: https://turfflow-automation.onrender.com
      - key: WHATSAPP_PHONE_NUMBER
        value: "9579158374"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://ggnbitabcjehzvmgupdi.supabase.co
      - key: VITE_SUPABASE_URL
        value: https://ggnbitabcjehzvmgupdi.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: TurfFlow Arena
      - key: SMS_PROVIDER
        value: fast2sms
      - key: SMS_API_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
